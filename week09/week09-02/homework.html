        <h3>Change 1 & 2: WebP Image Conversion & Explicit Dimensions</h3>
        <p>Replaced the raw logo asset with a compressed WebP format and defined explicit width and height attributes to reserve space and prevent layout shifts (CLS).</p>
        <pre><code>&lt;img src="Gaze_ logo.webp"
     alt="Gaze Logo"
     class="auth-logo"
     width="150"
     height="150"&gt;</code></pre>

        <h3>Change 3: Lazy Loading</h3>
        <p>Added the <code>loading="lazy"</code> attribute to avatar images rendered in dynamic lists so images below the fold do not load upfront.</p>
        <pre><code>createChatItem(name, avatarUrl, lastMsg, chatId) {
  const div = document.createElement('div');
  div.className = 'list-item';
  div.innerHTML = `
    &lt;div class="avatar" style="background-image: url(${avatarUrl || ''})" loading="lazy"&gt;
      ${!avatarUrl ? name.charAt(0).toUpperCase() : ''}
    &lt;/div&gt;...`;
  return div;
}</code></pre>

        <h3>Change 4: Defer on Scripts</h3>
        <p>Added the <code>defer</code> attribute to external script libraries (jQuery, Bootstrap, and Firebase SDKs) in the document head to eliminate render-blocking behavior during HTML parsing.</p>
        <pre><code>&lt;script src="https://code.jquery.com/jquery-3.6.0.min.js" defer&gt;&lt;/script&gt;
&lt;script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" defer&gt;&lt;/script&gt;
&lt;script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer&gt;&lt;/script&gt;</code></pre>

    <div class="section">
        <h2>3. Impact Analysis: Which Change Had the Most Impact and Why?</h2>
        <p><strong>The optimization with the most significant performance impact was adding <code>defer</code> to the external scripts (jQuery, Bootstrap, and multiple Firebase SDKs).</strong></p>
        <p><strong>Why?</strong> In web performance, script execution is inherently render-blocking. Because the application relies heavily on external libraries loaded in the document head, the browser previously had to completely halt HTML parsing, wait for heavy scripts to download over the network, execute them synchronously, and only *then* render the user interface. This severely stalled the First Contentful Paint (FCP).</p>
        <p>By appending the <code>defer</code> attribute, the browser was able to download all heavy JavaScript files asynchronously in the background while building the DOM structure concurrently. This single change drastically lowered the initial blocking time and yielded the largest measurable jump in the overall Lighthouse performance score.</p>
    </div>
