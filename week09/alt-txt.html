<!DOCTYPE html>
<html>
<body style="font-family:system-ui;padding:24px;max-width:500px">
<style>
    .img-placeholder {width:100%; height:80px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:6px; border:2px dashed #999; }
    .label { font-size:12px; color:#666; margin-bottom:14px; }
    .check { padding:6px 10px; background:#dcfce7; border-radius:4px; font-size:12px; margin-bottom:10px; display:none; }
</style>

<!-- Image 1: campus photo (descriptive alt) -->
<div class="img-placeholder" style="background:#e0eaff">🏫</div>
<img src="campus.jpg" alt="Gachon University main building, a modern glass structure surrounded by trees">
<p class="label">Image 1: Campus building photo (informational)</p>

<!-- Image 2: decorative wave (empty alt for screen readers to skip) -->
<div class="img-placeholder" style="background:#f0fdf4">〰️</div>
<img src="wave.svg" alt="">
<p class="label">Image 2: Decorative wavy divider</p>

<!-- Image 3: linked logo (describing the link destination) -->
<div class="img-placeholder" style="background:#fef3c7">🏫</div>
<a href="/"><img src="logo.png" alt="Gachon University — go to homepage"></a>
<p class="label">Image 3: University logo (inside a link to homepage)</p>

<!-- Image 4: bar chart (summary of key data values) -->
<div class="img-placeholder" style="background:#f5f0ff">📊</div>
<img src="chart.png" alt="Bar chart showing student enrollment: 2024: 1,200 students; 2025: 1,400 students; 2026: 1,476 students">
<p class="label">Image 4: Enrollment chart</p>

</body>
</html>
