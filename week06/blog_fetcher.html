<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog Library</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f8fa;
  color: #202630;
}

.topbar {
  background: #fff;
  border-bottom: 1px solid #e5e8ed;
  padding: 18px 7%;
}

.brand {
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 0.12em;
  color: #52627a;
  text-transform: uppercase;
}

main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 48px 24px;
}

.intro {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  margin-bottom: 30px;
}

.intro h1 {
  margin: 0 0 10px;
  font-size: clamp(34px, 5vw, 52px);
  letter-spacing: -0.04em;
}

.intro p {
  margin: 0;
  color: #737d8c;
  line-height: 1.5;
}

.count-badge {
  flex-shrink: 0;
  padding: 10px 14px;
  border-radius: 20px;
  background: #e9efff;
  color: #385fc2;
  font-size: 13px;
  font-weight: bold;
}

.controls {
  display: flex;
  gap: 12px;
  padding: 16px;
  margin-bottom: 20px;
  background: #fff;
  border: 1px solid #e5e8ed;
  border-radius: 12px;
  box-shadow: 0 4px 14px #26324808;
}

input, select, button {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 8px;
  font-size: 14px;
}

input, select {
  color: #202630;
  background: #fff;
  border: 1px solid #d9dee7;
}

input {
  flex: 1;
  min-width: 180px;
}

input:focus, select:focus {
  outline: 2px solid #a9bcff;
  border-color: #6487ec;
}

button {
  border: 0;
  background: #4569d4;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover:not(:disabled) {
  background: #3456bc;
}

button:disabled {
  cursor: wait;
  opacity: 0.55;
}

#status {
  min-height: 22px;
  margin: 0 0 16px;
  color: #737d8c;
  font-size: 13px;
}

#posts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
}

article {
  display: flex;
  flex-direction: column;
  min-height: 255px;
  padding: 22px;
  background: #fff;
  border: 1px solid #e5e8ed;
  border-radius: 12px;
  box-shadow: 0 4px 14px #26324808;
  transition: transform 0.2s, box-shadow 0.2s;
}

article:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px #26324812;
}

.post-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #7c8797;
  font-size: 12px;
}

.post-number {
  color: #4569d4;
  font-weight: bold;
}

article h2 {
  margin: 22px 0 12px;
  color: #26344b;
  font-size: 19px;
  line-height: 1.35;
  text-transform: capitalize;
}

article p {
  margin: 0 0 22px;
  color: #687386;
  font-size: 14px;
  line-height: 1.65;
}

.read-label {
  margin-top: auto;
  color: #4569d4;
  font-size: 13px;
  font-weight: bold;
}

@media (max-width: 620px) {
  main {
    padding: 32px 16px;
  }

  .intro {
    align-items: flex-start;
    flex-direction: column;
  }

  .controls {
    flex-direction: column;
  }

  input {
    width: 100%;
  }
}
</style>
</head>

<body>
<div class="topbar">
  <div class="brand">Open Library</div>
</div>

<main>
  <section class="intro">
    <div>
      <h1>Blog Library</h1>
      <p>Browse, search, and explore the latest posts.</p>
    </div>
    <div class="count-badge" id="totalCount">Post collection</div>
  </section>

  <div class="controls">
    <input id="search" placeholder="Search by title or keyword...">

    <select id="limit" aria-label="Number of posts to show">
      <option value="10">Show 10 posts</option>
      <option value="20">Show 20 posts</option>
      <option value="50">Show 50 posts</option>
      <option value="100">Show all posts</option>
    </select>

    <button id="load">Load Posts</button>
  </div>

  <p id="status">Loading posts...</p>
  <section id="posts" aria-live="polite"></section>
</main>

<script>
const API = "https://jsonplaceholder.typicode.com/posts";
const postsEl = document.getElementById("posts");
const statusEl = document.getElementById("status");
const loadBtn = document.getElementById("load");
const totalCountEl = document.getElementById("totalCount");
let allPosts = [];

async function loadPosts() {
  loadBtn.disabled = true;
  statusEl.textContent = "Loading posts...";
  postsEl.replaceChildren();

  try {
    const response = await fetch(API);
    if (!response.ok) throw new Error("API request failed");

    allPosts = await response.json();
    totalCountEl.textContent = `${allPosts.length} posts in collection`;
    renderPosts();
  } catch (error) {
    statusEl.textContent =
      "Unable to load posts. Check your internet and try again.";
    totalCountEl.textContent = "Posts unavailable";
  } finally {
    loadBtn.disabled = false;
  }
}

function renderPosts() {
  const query = document.getElementById("search").value.toLowerCase();
  const limit = Number(document.getElementById("limit").value);

  const results = allPosts
    .filter(post =>
      (post.title + " " + post.body).toLowerCase().includes(query)
    )
    .slice(0, limit);

  postsEl.replaceChildren();
  statusEl.textContent =
    `Showing ${results.length} of ${allPosts.length} posts`;

  if (!results.length) {
    statusEl.textContent = "No matching posts found.";
    return;
  }

  results.forEach(post => {
    const card = document.createElement("article");
    const meta = document.createElement("div");
    const number = document.createElement("span");
    const author = document.createElement("span");
    const heading = document.createElement("h2");
    const body = document.createElement("p");
    const readLabel = document.createElement("div");

    meta.className = "post-meta";
    number.className = "post-number";
    readLabel.className = "read-label";

    number.textContent = `POST ${String(post.id).padStart(2, "0")}`;
    author.textContent = `Author ${post.userId}`;
    heading.textContent = post.title;
    body.textContent = post.body;
    readLabel.textContent = "From the collection →";

    meta.append(number, author);
    card.append(meta, heading, body, readLabel);
    postsEl.appendChild(card);
  });
}

loadBtn.addEventListener("click", loadPosts);
document.getElementById("search").addEventListener("input", renderPosts);
document.getElementById("limit").addEventListener("change", renderPosts);

loadPosts();
</script>
</body>
</html>
