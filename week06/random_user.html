<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My People Finder</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px 20px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #263238;
  background: #eef3f2;
}

main {
  max-width: 1000px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

header .label {
  color: #557a72;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

h1 {
  margin: 10px 0;
  color: #234b43;
  font-size: clamp(32px, 5vw, 46px);
}

header p {
  margin: 0;
  color: #687875;
  line-height: 1.6;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 18px;
  margin-bottom: 18px;
  background: #fff;
  border: 1px solid #d8e3df;
  border-radius: 14px;
}

.controls label {
  color: #52635f;
  font-size: 14px;
}

select, button {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 15px;
}

select {
  margin-left: 6px;
  color: #263238;
  background: #fff;
  border: 1px solid #c8d7d2;
}

button {
  color: white;
  background: #39796a;
  border: 0;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.2s;
}

button:hover:not(:disabled) {
  background: #2c6255;
}

button:disabled {
  opacity: 0.55;
  cursor: wait;
}

#status {
  min-height: 24px;
  color: #667772;
  text-align: center;
  font-size: 14px;
}

#users {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 16px;
}

.profile-card {
  padding: 22px;
  background: #fff;
  border: 1px solid #d8e3df;
  border-radius: 14px;
  box-shadow: 0 6px 18px #233c3510;
  overflow-wrap: anywhere;
}

.profile-card img {
  display: block;
  width: 96px;
  height: 96px;
  margin: 0 auto 14px;
  border: 4px solid #e1eee9;
  border-radius: 50%;
  object-fit: cover;
}

.profile-card h2 {
  margin: 0 0 16px;
  color: #234b43;
  text-align: center;
  font-size: 20px;
}

.profile-card p {
  margin: 9px 0;
  color: #62716d;
  font-size: 14px;
  line-height: 1.5;
}

.profile-card strong {
  color: #344943;
}

@media (max-width: 520px) {
  body {
    padding: 28px 14px;
  }

  .controls {
    align-items: stretch;
    flex-direction: column;
  }

  .controls label {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  select, button {
    width: 100%;
  }

  select {
    margin-left: 12px;
  }
}
</style>
</head>

<body>
<main>
  <header>
    <div class="label">A little people finder</div>
    <h1>My People Finder</h1>
    <p>Discover random profiles with photos and contact details.</p>
  </header>

  <div class="controls">
    <label for="count">
      Number of profiles
      <select id="count">
        <option value="1">1 profile</option>
        <option value="6" selected>6 profiles</option>
        <option value="9">9 profiles</option>
        <option value="12">12 profiles</option>
      </select>
    </label>

    <button id="generate">Find Profiles</button>
  </div>

  <p id="status" role="status" aria-live="polite">Loading profiles...</p>
  <section id="users" aria-label="Random user profiles"></section>
</main>

<script>
const usersEl = document.getElementById("users");
const statusEl = document.getElementById("status");
const generateButton = document.getElementById("generate");
const countSelect = document.getElementById("count");

async function loadUsers() {
  generateButton.disabled = true;
  statusEl.textContent = "Finding profiles...";
  usersEl.replaceChildren();

  try {
    const count = countSelect.value;
    const response = await fetch(
      `https://randomuser.me/api/?results=${count}`
    );

    if (!response.ok) {
      throw new Error("The request failed.");
    }

    const data = await response.json();

    data.results.forEach(user => {
      const card = document.createElement("article");
      card.className = "profile-card";

      const photo = document.createElement("img");
      photo.src = user.picture.large;
      photo.alt = `Profile photo of ${user.name.first} ${user.name.last}`;

      const name = document.createElement("h2");
      name.textContent = `${user.name.first} ${user.name.last}`;

      const email = document.createElement("p");
      email.innerHTML = "<strong>Email:</strong> ";
      email.append(document.createTextNode(user.email));

      const phone = document.createElement("p");
      phone.innerHTML = "<strong>Phone:</strong> ";
      phone.append(document.createTextNode(user.phone));

      const location = document.createElement("p");
      location.innerHTML = "<strong>Location:</strong> ";
      location.append(
        document.createTextNode(
          `${user.location.city}, ${user.location.country}`
        )
      );

      card.append(photo, name, email, phone, location);
      usersEl.appendChild(card);
    });

    statusEl.textContent =
      `Found ${data.results.length} profile${data.results.length === 1 ? "" : "s"}.`;
  } catch (error) {
    statusEl.textContent =
      "Could not load profiles. Check your internet and try again.";
  } finally {
    generateButton.disabled = false;
  }
}

generateButton.addEventListener("click", loadUsers);

loadUsers();
</script>
</body>
</html>
