<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Explorer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 48px 20px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #101426;
  color: #f2f4ff;
}

main {
  max-width: 780px;
  margin: auto;
  text-align: center;
}

.eyebrow {
  color: #73e6e0;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

h1 {
  margin: 12px 0;
  color: #f2f4ff;
  font-size: clamp(32px, 6vw, 48px);
}

.intro {
  color: #aab2d0;
  line-height: 1.6;
}

form {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 28px 0 20px;
  padding: 14px;
  background: #191f37;
  border: 1px solid #2d3657;
  border-radius: 14px;
}

input, button {
  padding: 13px 16px;
  border-radius: 9px;
  font-size: 15px;
}

input {
  flex: 1;
  min-width: 200px;
  color: #f2f4ff;
  background: #101426;
  border: 1px solid #394364;
}

input::placeholder {
  color: #828ba8;
}

input:focus {
  outline: 2px solid #73e6e0;
  border-color: #73e6e0;
}

button {
  color: #101426;
  background: #73e6e0;
  border: 0;
  cursor: pointer;
  font-weight: bold;
  transition: transform 0.2s, background 0.2s;
}

button:hover:not(:disabled) {
  background: #9af2ec;
  transform: translateY(-1px);
}

#randomBtn {
  color: #fff;
  background: #7867e8;
}

#randomBtn:hover:not(:disabled) {
  background: #9182f5;
}

button:disabled {
  opacity: 0.5;
  cursor: wait;
}

#status {
  min-height: 24px;
  color: #aab2d0;
  font-size: 14px;
}

.card {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 8px 24px;
  align-items: center;
  margin-top: 22px;
  padding: 28px;
  background: #191f37;
  border: 1px solid #303a5f;
  border-radius: 18px;
  box-shadow: 0 18px 45px #05071170;
  text-align: left;
}

.card img {
  grid-row: span 4;
  width: 100%;
  max-width: 220px;
  aspect-ratio: 1;
  object-fit: contain;
  padding: 12px;
  background: radial-gradient(circle, #343d6b, #202744 68%);
  border-radius: 16px;
}

.card h2 {
  margin: 0;
  color: #fff;
  font-size: 30px;
  text-transform: capitalize;
}

.types {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0;
}

.type {
  padding: 7px 13px;
  color: #101426;
  background: #73e6e0;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  text-transform: capitalize;
}

.abilities {
  margin: 5px 0 10px;
  color: #b8c0db;
  line-height: 1.5;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(110px, 1fr));
  gap: 9px;
  width: 100%;
  margin-top: 8px;
}

.stat {
  padding: 11px 12px;
  color: #b8c0db;
  background: #222a47;
  border: 1px solid #303a5f;
  border-radius: 8px;
  font-size: 13px;
  text-transform: capitalize;
}

.stat strong {
  float: right;
  color: #73e6e0;
}

@media (max-width: 600px) {
  body {
    padding: 32px 14px;
  }

  form {
    flex-direction: column;
  }

  form input, form button {
    width: 100%;
  }

  .card {
    grid-template-columns: 1fr;
    padding: 20px;
    text-align: center;
  }

  .card img {
    grid-row: auto;
    justify-self: center;
  }

  .types {
    justify-content: center;
  }

  .stats {
    text-align: left;
  }
}
</style>
</head>

<body>
<main>
  <div class="eyebrow">Pokédex · Field Guide</div>
  <h1>⚡ Pokémon Explorer</h1>
  <p class="intro">
    Search a Pokémon to see its image, types, abilities, and stats.
  </p>

  <form id="searchForm">
    <input
      id="pokemonName"
      placeholder="Enter name or ID"
      value="pikachu"
      required
    >
    <button id="searchBtn">Search</button>
    <button type="button" id="randomBtn">Random Pokémon</button>
  </form>

  <p id="status" aria-live="polite">Loading Pokémon...</p>
  <section id="result"></section>
</main>

<script>
const input = document.getElementById("pokemonName");
const result = document.getElementById("result");
const statusEl = document.getElementById("status");
const searchBtn = document.getElementById("searchBtn");

async function loadPokemon(value) {
  const name = value.trim().toLowerCase();
  if (!name) return;

  searchBtn.disabled = true;
  statusEl.textContent = "Loading Pokémon...";
  result.replaceChildren();

  try {
    const response = await fetch(
      `https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(name)}`
    );

    if (!response.ok) throw new Error("Pokémon not found");
    const p = await response.json();

    const card = document.createElement("article");
    card.className = "card";

    const image = document.createElement("img");
    image.src = p.sprites.other["official-artwork"].front_default
      || p.sprites.front_default || "";
    image.alt = p.name;

    const title = document.createElement("h2");
    title.textContent = `#${p.id} ${p.name}`;

    const types = document.createElement("div");
    types.className = "types";

    p.types.forEach(item => {
      const badge = document.createElement("span");
      badge.className = "type";
      badge.textContent = item.type.name;
      types.appendChild(badge);
    });

    const abilities = document.createElement("p");
    abilities.className = "abilities";
    abilities.textContent = "Abilities: " + p.abilities
      .map(a => a.ability.name.replaceAll("-", " "))
      .join(", ");

    const stats = document.createElement("div");
    stats.className = "stats";

    p.stats.forEach(item => {
      const box = document.createElement("div");
      box.className = "stat";

      const label = document.createElement("span");
      label.textContent = item.stat.name.replaceAll("-", " ");

      const value = document.createElement("strong");
      value.textContent = item.base_stat;

      box.append(label, value);
      stats.appendChild(box);
    });

    card.append(image, title, types, abilities, stats);
    result.appendChild(card);
    statusEl.textContent = "Pokémon loaded successfully.";
  } catch (error) {
    statusEl.textContent =
      "Pokémon not found. Check the name or ID and try again.";
  } finally {
    searchBtn.disabled = false;
  }
}

document.getElementById("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  loadPokemon(input.value);
});

document.getElementById("randomBtn").addEventListener("click", () => {
  const id = Math.floor(Math.random() * 1025) + 1;
  input.value = id;
  loadPokemon(id);
});

loadPokemon("pikachu");
</script>
</body>
</html>
