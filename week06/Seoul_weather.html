<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 3 | Seoul Weather</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #18212b;
      color: #f0f5f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 60px 16px;
      margin: 0;
    }

    .card {
      background: #24313d;
      max-width: 480px;
      width: 100%;
      padding: 32px;
      border-radius: 18px;
      border: 1px solid #3b4d59;
      box-shadow: 0 12px 35px #00000035;
      text-align: left;
    }

    h1 {
      color: #9de5cd;
      margin-top: 0;
    }

    .card > p {
      color: #c0cbc9;
      line-height: 1.5;
    }

    button {
      background: #9de5cd;
      color: #18212b;
      border: 0;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    button:hover {
      background: #b8f1dd;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #weather {
      margin-top: 24px;
      padding: 18px;
      background: #1c2832;
      border-radius: 12px;
      color: #f0f5f4;
      font-size: 18px;
    }

    #weather h2 {
      color: #9de5cd;
      font-size: 42px;
      margin: 0 0 8px;
    }

    #weather p {
      margin: 0 0 10px;
    }

    #weather small {
      color: #aab9b6;
    }

    #status {
      color: #9de5cd;
    }

    .error {
      color: #ff9d9d !important;
    }

    .back-button {
      position: fixed;
      top: 18px;
      left: 18px;
      padding: 9px 14px;
      background: #344550;
      color: #f0f5f4;
    }
  </style>

  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <button class="back-button" type="button" onclick="history.back()">Back</button>

  <main class="card">
    <h1>🌤️ Seoul Weather</h1>
    <p>Scenario: show the current conditions before a day trip.</p>
    <button id="load-button">Check weather</button>
    <section id="weather"></section>
    <p id="status" aria-live="polite"></p>
  </main>

  <script>
    const button = document.querySelector("#load-button");
    const weather = document.querySelector("#weather");
    const status = document.querySelector("#status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.className = "";
      status.textContent = "Checking Seoul...";

      try {
        const response = await fetch(
          "https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&current_weather=true"
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        weather.innerHTML = `
          <h2>${data.current_weather.temperature}°C</h2>
          <p>Wind: ${data.current_weather.windspeed} km/h</p>
          <small>Seoul · ${data.current_weather.time}</small>
        `;

        status.textContent = "";
      } catch (error) {
        status.className = "error";
        status.textContent = "Weather data could not be loaded.";
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
