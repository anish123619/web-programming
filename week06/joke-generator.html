<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Joke Fetcher</title>

  <style>
    body {
      max-width: 600px;
      margin: 50px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    button {
      margin: 8px;
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      min-height: 24px;
    }

    #joke-area {
      margin: 24px 0;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-right: 8px;
      vertical-align: middle;
      border: 3px solid #ccc;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .favourite {
      padding: 12px;
      margin: 10px 0;
      text-align: left;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .favourite p {
      margin: 6px 0;
    }
  </style>
</head>

<body>
  <h1>Random Joke Fetcher</h1>

  <button id="load-button">Load Joke</button>
  <button id="save-button" disabled>Save Favourite</button>

  <p id="status" role="status" aria-live="polite"></p>

  <div id="joke-area">
    <p id="setup">Click “Load Joke” to get a joke.</p>
    <p id="punchline"></p>
  </div>

  <h2>Favourite Jokes</h2>
  <div id="favourites">
    <p>No favourites saved yet.</p>
  </div>

  <script>
    const jokeUrl =
      'https://official-joke-api.appspot.com/random_joke';

    const loadButton = document.getElementById('load-button');
    const saveButton = document.getElementById('save-button');
    const status = document.getElementById('status');
    const setup = document.getElementById('setup');
    const punchline = document.getElementById('punchline');
    const favouritesArea = document.getElementById('favourites');

    let currentJoke = null;

    loadButton.addEventListener('click', loadJoke);
    saveButton.addEventListener('click', saveFavourite);

    async function loadJoke() {
      status.innerHTML = '<span class="spinner"></span>Loading…';
      setup.textContent = '';
      punchline.textContent = '';
      currentJoke = null;

      loadButton.disabled = true;
      saveButton.disabled = true;

      try {
        const response = await fetch(jokeUrl);

        // fetch() does not treat HTTP errors like 404 as failures,
        // so check response.ok ourselves.
        if (!response.ok) {
          throw new Error('The server could not provide a joke.');
        }

        const data = await response.json();

        currentJoke = {
          setup: data.setup,
          punchline: data.punchline
        };

        setup.textContent = currentJoke.setup;
        punchline.textContent = currentJoke.punchline;
        status.textContent = '';
        saveButton.disabled = false;
      } catch (error) {
        status.textContent =
          'Sorry, we could not load a joke. Please check your internet connection and try again.';
      } finally {
        loadButton.disabled = false;
      }
    }

    function saveFavourite() {
      if (!currentJoke) {
        return;
      }

      try {
        const savedJokes = JSON.parse(
          localStorage.getItem('favourite-jokes') || '[]'
        );

        savedJokes.push(currentJoke);

        localStorage.setItem(
          'favourite-jokes',
          JSON.stringify(savedJokes)
        );

        status.textContent = 'Favourite saved!';
        showFavourites();
      } catch (error) {
        status.textContent =
          'Sorry, this browser could not save the favourite.';
      }
    }

    function showFavourites() {
      try {
        const savedJokes = JSON.parse(
          localStorage.getItem('favourite-jokes') || '[]'
        );

        favouritesArea.textContent = '';

        if (savedJokes.length === 0) {
          favouritesArea.textContent = 'No favourites saved yet.';
          return;
        }

        savedJokes.forEach(function (joke) {
          const item = document.createElement('div');
          item.className = 'favourite';

          const jokeSetup = document.createElement('p');
          jokeSetup.textContent = joke.setup;

          const jokePunchline = document.createElement('p');
          jokePunchline.textContent = joke.punchline;

          item.appendChild(jokeSetup);
          item.appendChild(jokePunchline);
          favouritesArea.appendChild(item);
        });
      } catch (error) {
        favouritesArea.textContent =
          'Could not load saved favourites.';
      }
    }

    // Show favourites saved during an earlier visit.
    showFavourites();
  </script>
</body>
</html>
