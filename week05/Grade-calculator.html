
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 300px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 12px #00000020;
        }

        h1 {
            color: #334155;
        }

        p {
            color: #64748b;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #reset {
            background-color: #64748b;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Grade Calculator</h1>
        <p>Enter your examination score</p>

        <input type="number" id="score" placeholder="Enter score (0-100)">

        <button onclick="calculateGrade()">Calculate Grade</button>

        <button id="reset" onclick="resetGrade()">Reset</button>

        <div id="result">Your grade will appear here</div>

    </div>

    <script>
        function calculateGrade() {

            let score = Number(document.getElementById("score").value);
            let result = document.getElementById("result");

            if (document.getElementById("score").value === "") {
                result.textContent = "Please enter a score.";
            }

            else if (score < 0 || score > 100) {
                result.textContent = "Enter a score between 0 and 100.";
            }

            else if (score >= 90) {
                result.textContent = "Grade: A";
            }

            else if (score >= 80) {
                result.textContent = "Grade: B";
            }

            else if (score >= 70) {
                result.textContent = "Grade: C";
            }

            else {
                result.textContent = "Grade: F";
            }
        }

        function resetGrade() {
            document.getElementById("score").value = "";
            document.getElementById("result").textContent =
                "Your grade will appear here";
        }
    </script>

</body>
</html>
