<!DOCTYPE html>
<html>
<head>
    <title>Grade Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8f0e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #fffdf7;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px #243b2a20;
            width: 300px;
        }

        h1 {
            color: #344e41;
        }

        label {
            display: block;
            margin: 20px 0 10px;
            color: #475569;
        }

        input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #588157;
            border-color: #588157;
        }

        h2 {
            margin-top: 25px;
            color: #344e41;
        }

        #grade {
            color: #588157;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Grade Checker</h1>

        <label for="number">Adjust your score:</label>

        <input type="number" id="number"
               min="0" max="100" placeholder="Enter score"
               oninput="checkGrade()">

        <h2>Grade: <span id="grade">—</span></h2>
    </div>

    <script>
        function checkGrade() {
            const input = document.getElementById("number");
            const grade = document.getElementById("grade");

            if (input.value === "") {
                grade.textContent = "—";
                return;
            }

            let score = Number(input.value);
            score = Math.max(0, Math.min(100, score));
            input.value = score;

            let result;

            if (score >= 90) {
                result = "A";
            } else if (score >= 80) {
                result = "B";
            } else if (score >= 70) {
                result = "C";
            } else {
                result = "F";
            }

            grade.textContent = result;
        }
    </script>

</body>
</html>
