<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counter Mini-App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px #00000015;
            width: 300px;
        }

        h1 {
            color: #1e293b;
        }

        #count {
            font-size: 60px;
            font-weight: bold;
            margin: 25px 0;
            color: #8b5cf6;
            transition: transform 0.1s ease;
        }

        .count-bump {
            transform: scale(1.15);
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .add {
            background: #0ea5e9;
        }

        .subtract {
            background: #f43f5e;
        }

        .reset {
            background: #64748b;
        }

        button:hover {
            opacity: 0.85;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Counter App</h1>

        <div>Current Count</div>
        <div id="count">13</div>

        <button class="add" onclick="change(1)">+ Add</button>
        <button class="subtract" onclick="change(-1)">− Subtract</button>
        <br>
        <button class="reset" onclick="reset()">Reset</button>
    </div>

    <script>
        let count = 13;
        const countEl = document.getElementById("count");

        function bumpEffect() {
            countEl.classList.add("count-bump");
            setTimeout(() => {
                countEl.classList.remove("count-bump");
            }, 100);
        }

        function change(amount) {
            count = count + amount;
            countEl.textContent = count;
            bumpEffect();
        }

        function reset() {
            count = 0;
            countEl.textContent = count;
            bumpEffect();
        }
    </script>

</body>
</html>
