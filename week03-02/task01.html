
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Card</title>

    <style>
        .card {
            position: relative;
            width: 280px;
            height: 180px;
            background-color: white;
            border: 2px solid teal;
            border-radius: 12px;
            padding: 20px;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: teal;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
        }
    </style>
</head>

<body>

    <div class="card">
        <span class="badge">SALE</span>

        <h2>Special Offer</h2>
        <p>Get this product at a discounted price!</p>
    </div>

</body>
</html>
