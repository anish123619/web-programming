
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Card</title>

    <style>
        .card {
            width: 280px;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

            /* Transition goes on the base card */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 20px rgba(0, 128, 128, 0.4);
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Hover Me</h2>
        <p>Move your mouse over this card.</p>
    </div>

</body>
</html>
