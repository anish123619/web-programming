<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        :root {
            --bg: #07080a;
            --panel: #101216;
            --text: #e8e8ea;
            --muted: #8a8f98;
            --danger: #ff2d2d;
            --warn: #ffc400;
            --cyan: #00e5ff;
        }

        * { box-sizing: border-box; }

        body {
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 72px 24px 48px;
            background:
                radial-gradient(ellipse at 50% -10%, rgba(255, 45, 45, 0.18), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: "Consolas", "SF Mono", "Courier New", monospace;
            overflow-x: hidden;
        }

        /* Hazard tape across the top */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 20px;
            background: repeating-linear-gradient(
                -45deg,
                var(--warn) 0 16px,
                #111 16px 32px
            );
            box-shadow: 0 4px 24px rgba(255, 196, 0, 0.35);
            z-index: 5;
        }

        /* CRT scanlines */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.03) 0 1px,
                transparent 1px 3px
            );
            pointer-events: none;
            z-index: 4;
        }

        main {
            position: relative;
            max-width: 680px;
            margin: 0 auto;
        }

        /* Glitching headline */
        h1 {
            position: relative;
            margin: 0 0 12px;
            font-size: clamp(2rem, 8vw, 3.6rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--text);
            text-shadow: 0 0 18px rgba(255, 45, 45, 0.55);
        }
        h1::before,
        h1::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        h1::before {
            color: var(--cyan);
            text-shadow: none;
            animation: glitch-a 3.2s infinite steps(1);
        }
        h1::after {
            color: var(--danger);
            text-shadow: none;
            animation: glitch-b 3.2s infinite steps(1);
        }

        @keyframes glitch-a {
            0%, 90%, 100% { transform: none; clip-path: inset(0 0 100% 0); }
            91% { transform: translate(-4px, 1px); clip-path: inset(10% 0 60% 0); }
            94% { transform: translate(3px, -1px); clip-path: inset(55% 0 15% 0); }
            97% { transform: translate(-2px, 0); clip-path: inset(30% 0 40% 0); }
        }
        @keyframes glitch-b {
            0%, 88%, 100% { transform: none; clip-path: inset(0 0 100% 0); }
            89% { transform: translate(4px, -1px); clip-path: inset(60% 0 10% 0); }
            93% { transform: translate(-3px, 1px); clip-path: inset(5% 0 70% 0); }
            96% { transform: translate(2px, 0); clip-path: inset(40% 0 30% 0); }
        }

        /* Terminal-style intro line */
        p {
            margin: 0 0 32px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }
        p::before {
            content: "> ";
            color: var(--danger);
            font-weight: 700;
        }
        p::after {
            content: "_";
            margin-left: 2px;
            color: var(--danger);
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Link list as warning panels */
        ul {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 18px;
        }

        li {
            position: relative;
            background: var(--panel);
            border: 1px solid #23262d;
            border-left: 6px solid var(--danger);
            border-radius: 4px;
            box-shadow: 0 0 0 rgba(255, 45, 45, 0);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }
        li:hover,
        li:focus-within {
            transform: translateX(8px);
            border-left-color: var(--warn);
            box-shadow: 0 0 28px rgba(255, 45, 45, 0.45);
        }

        a {
            display: block;
            padding: 20px 56px 20px 22px;
            color: var(--text);
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.02em;
        }
        a::after {
            content: "\2192";
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--danger);
            font-size: 1.4rem;
            transition: transform 0.18s ease, color 0.18s ease;
        }
        a:hover { color: var(--warn); }
        a:hover::after {
            color: var(--warn);
            transform: translate(6px, -50%);
        }
        a:focus-visible {
            outline: 3px solid var(--cyan);
            outline-offset: -3px;
        }

        @media (prefers-reduced-motion: reduce) {
            h1::before, h1::after { animation: none; display: none; }
            p::after { animation: none; }
            li, a::after { transition: none; }
        }

        @media (max-width: 480px) {
            body { padding-top: 56px; }
            li:hover, li:focus-within { transform: none; }
        }
    </style>
</head>
<body>

    <main>
        <h1 data-text="Welcome to My Website">Welcome to My Website</h1>
        <p>Check out my deployed projects on GitHub Pages:</p>

        <ul>
            <li>
                <a href="https://github.com/anish123619/portfolio/commits/main/" target="_blank" rel="noopener noreferrer">Portfolio repo commits.</a>
            </li>
            <li>
                <a href="https://anish123619.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Portfolio live page URL.</a>
            </li>
        </ul>
    </main>

</body>
</html>
