<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f1f5f9;
  }

  .card {
    background-color: #ffffff;
    width: 300px;
    padding: 32px 24px;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background-color: #10B981;
    color: #ffffff;
    font-size: 2rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  .name {
    font-size: 1.5rem;
    font-weight: bold;
    color: #0f172a;
    margin-bottom: 4px;
  }

  .role {
    font-size: 0.95rem;
    color: #64748b;
    margin-bottom: 20px;
  }

  .divider {
    width: 100%;
    height: 1px;
    background-color: #e2e8f0;
    border: none;
    margin-bottom: 20px;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .badge {
    background-color: #10B981;
    color: #ffffff;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">J</div>
    <div class="name">Tamang ANISH.</div>
    <div class="role">Frontend Developer</div>
    <hr class="divider">
    <div class="badges">
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
      <span class="badge">JavaScript</span>
      <span class="badge">React</span>
    </div>
  </div>

</body>
</html>
