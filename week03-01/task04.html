<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }

  .box-model {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .label {
    font-weight: bold;
    font-size: 13px;
    color: #ffffff;
    margin-bottom: 8px;
    font-family: monospace;
  }

  .margin {
    background-color: #F59E0B; /* amber */
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .border {
    background-color: #475569; /* slate */
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .padding {
    background-color: #38BDF8; /* sky blue */
    padding: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .content {
    background-color: #8B5CF6; /* violet */
    width: 140px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: bold;
    font-family: monospace;
    font-size: 13px;
    border-radius: 4px;
  }
</style>
</head>
<body>

  <div class="box-model margin">
    <span class="label">MARGIN</span>
    <div class="border">
      <span class="label">BORDER</span>
      <div class="padding">
        <span class="label">PADDING</span>
        <div class="content">CONTENT</div>
      </div>
    </div>
  </div>

</body>
</html>
