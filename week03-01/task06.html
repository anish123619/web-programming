<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: sans-serif;
  }

  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #1e293b;
    padding: 16px 32px;
  }

  .navbar__logo {
    color: #ffffff;
    font-size: 1.3rem;
    font-weight: bold;
  }

  .navbar__links {
    display: flex;
    gap: 24px;
    list-style: none;
  }

  .navbar__links a {
    color: #ffffff;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
  }

  .navbar__links a:hover {
    color: #10B981;
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar__logo">Brand</div>
    <ul class="navbar__links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
