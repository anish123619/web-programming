
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        .card {
            width: 300px;
            padding: 30px;
            margin: 50px auto;
            text-align: center;
            background-color: white;
            color: black;
            border: 2px solid #333;
            border-radius: 15px;
        }

        .card.dark {
            background-color: #222;
            color: white;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card" id="profileCard">
        <h2>Anish Tamang</h2>
        <p>Computer Engineering Student</p>
        <p>Gachon University</p>

        <button id="toggleButton">Dark Mode</button>
    </div>

    <script>
        // Select the card and button
        const card = document.querySelector('#profileCard');
        const button = document.querySelector('#toggleButton');

        // Add click event listener
        button.addEventListener('click', function() {

            // Toggle the dark class
            card.classList.toggle('dark');

            // Check whether the card has the dark class
            if (card.classList.contains('dark')) {
                button.textContent = 'Light Mode';
            } else {
                button.textContent = 'Dark Mode';
            }
        });
    </script>

</body>
</html>
